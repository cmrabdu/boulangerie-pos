<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no : sur une caisse, un zoom accidentel à
     deux doigts rend l'écran inutilisable et personne ne saura le défaire. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Caisse</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Jeu d'icônes de catégories, dessiné à la main et posé en ligne.
     Aucun fichier à charger, aucune police d'icônes, et un rendu net à toutes
     les tailles — ce que ne donnerait ni une image bitmap ni un émoji. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-pain" viewBox="0 0 24 24">
    <path d="M3.6 12.6c0-2.9 3.8-5.1 8.4-5.1s8.4 2.2 8.4 5.1c0 2.3-1.7 3.6-4 3.7-1.5.1-2.7.2-4.4.2s-2.9-.1-4.4-.2c-2.3-.1-4-1.4-4-3.7Z"/>
    <path d="M9.1 8.1 7.4 11m4.4-2.9L10.1 11m4.4-2.9L12.8 11"/>
  </symbol>
  <!-- Croissant : un croissant a trop de détails pour 23 px. On garde la seule
       chose qui le rend reconnaissable — le croissant de lune aux pointes
       effilées — et on jette le feuilletage, qui ne fait que du bruit. -->
  <symbol id="i-croissant" viewBox="0 0 24 24">
    <path d="M4 17.6c-1.4-6.2 2.6-11.4 8.8-11.9 3.4-.3 6.2 1 8 3.1-2.7-1.2-5.4-1-7.6.5-3.2 2.2-4.4 5.7-3.2 9-2.4.5-4.4.2-6-.7Z"/>
  </symbol>
  <!-- Pâtisserie : deux traits, une caissette et un dôme. -->
  <symbol id="i-patisserie" viewBox="0 0 24 24">
    <path d="M5.8 11.4h12.4l-1.5 7.7a1.7 1.7 0 0 1-1.7 1.4H9a1.7 1.7 0 0 1-1.7-1.4Z"/>
    <path d="M5.8 11.4a6.2 6.2 0 0 1 12.4 0"/>
  </symbol>
  <symbol id="i-sandwich" viewBox="0 0 24 24">
    <path d="M4.4 8.6c0-1.5 3.4-2.7 7.6-2.7s7.6 1.2 7.6 2.7-3.4 2.2-7.6 2.2S4.4 10.1 4.4 8.6Z"/>
    <path d="M4.4 12.2c1.9 1.1 4.5 1.6 7.6 1.6s5.7-.5 7.6-1.6"/>
    <path d="M4.4 15.6c1.9 1.2 4.5 1.8 7.6 1.8s5.7-.6 7.6-1.8"/>
  </symbol>
  <symbol id="i-boisson" viewBox="0 0 24 24">
    <path d="M6.6 8.6h10.8l-1.2 10.2a1.7 1.7 0 0 1-1.7 1.5H9.5a1.7 1.7 0 0 1-1.7-1.5Z"/>
    <path d="M5.6 8.6h12.8"/>
    <path d="M9.6 5.2c0-.9 1-1.4 1-2.4m3.8 2.4c0-.9 1-1.4 1-2.4"/>
  </symbol>
  <symbol id="i-divers" viewBox="0 0 24 24">
    <path d="M5.4 8.4h13.2l-1 11a1.7 1.7 0 0 1-1.7 1.5H8.1a1.7 1.7 0 0 1-1.7-1.5Z"/>
    <path d="M9 10.4V7.2a3 3 0 0 1 6 0v3.2"/>
  </symbol>
  <!-- Paiement. Dessinées plutôt que générées : elles doivent rester blanches
       et nettes sur un fond vert ou bleu saturé, ce qu'une image matricielle
       monochrome ne sait pas faire. -->
  <!-- Paiement : deux formes, pas une de plus. Ces icônes sont vues à un mètre,
       du coin de l'œil, pendant qu'on rend la monnaie — le détail y est un
       handicap, pas une richesse. Un billet (rectangle + pièce au centre)
       contre une carte (rectangle + bande sur toute la largeur) : les deux
       silhouettes ne peuvent pas se confondre. -->
  <symbol id="i-cash" viewBox="0 0 24 24">
    <rect x="1.8" y="5.2" width="20.4" height="13.6" rx="2.4"/>
    <circle cx="12" cy="12" r="3.3"/>
  </symbol>
  <symbol id="i-carte" viewBox="0 0 24 24">
    <rect x="1.8" y="5.2" width="20.4" height="13.6" rx="2.4"/>
    <path d="M1.8 10.4h20.4"/>
  </symbol>
</svg>

<div class="app">

  <!-- Colonne gauche : catégories + produits -->
  <main class="shop">
    <nav class="cats" id="cats" aria-label="Catégories"></nav>
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>

      <!-- Montant libre : encaisser ce qui n'est pas au catalogue. Le pavé
           glisse par-dessus la grille et laisse le ticket visible à droite,
           pour qu'on voie le total bouger en même temps qu'on tape. -->
      <section class="libre" id="libre" hidden aria-label="Montant libre">
        <p class="libre-titre">Montant libre</p>
        <output class="libre-ecran" id="libre-ecran">0,00 €</output>
        <div class="libre-pad" id="libre-pad">
          <button class="libre-touche" type="button" data-chiffre="1">1</button>
          <button class="libre-touche" type="button" data-chiffre="2">2</button>
          <button class="libre-touche" type="button" data-chiffre="3">3</button>
          <button class="libre-touche" type="button" data-chiffre="4">4</button>
          <button class="libre-touche" type="button" data-chiffre="5">5</button>
          <button class="libre-touche" type="button" data-chiffre="6">6</button>
          <button class="libre-touche" type="button" data-chiffre="7">7</button>
          <button class="libre-touche" type="button" data-chiffre="8">8</button>
          <button class="libre-touche" type="button" data-chiffre="9">9</button>
          <button class="libre-touche libre-secondaire" type="button" data-action="vider">C</button>
          <button class="libre-touche" type="button" data-chiffre="0">0</button>
          <button class="libre-touche libre-secondaire" type="button" data-action="effacer" aria-label="Effacer le dernier chiffre">⌫</button>
        </div>
        <div class="libre-actions">
          <button class="libre-annuler" type="button" data-action="fermer">Annuler</button>
          <button class="libre-ok" type="button" data-action="ajouter" disabled>Ajouter</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Colonne droite : le ticket -->
  <aside class="ticket">
    <header class="ticket-head">
      <h1 class="ticket-title">Ticket</h1>
      <button class="clear" id="clear" type="button" hidden>Tout effacer</button>
    </header>

    <div class="lines-wrap">
      <ul class="lines" id="lines"></ul>
      <p class="empty" id="empty">Touchez un produit<br>pour commencer</p>
    </div>

    <footer class="ticket-foot">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total" id="total">0,00 €</span>
      </div>
      <div class="pay">
        <button class="pay-btn pay-cash" id="pay-cash" type="button" disabled>
          <svg class="pay-ico" aria-hidden="true"><use href="#i-cash"></use></svg>
          <span>Cash</span>
        </button>
        <button class="pay-btn pay-card" id="pay-card" type="button" disabled>
          <svg class="pay-ico" aria-hidden="true"><use href="#i-carte"></use></svg>
          <span>Bancontact</span>
        </button>
      </div>
    </footer>
  </aside>

</div>

<!-- Écran de paiement, superposé -->
<section class="pay-screen" id="pay-screen" hidden aria-modal="true" role="dialog">
  <div class="pay-sheet">

    <button class="back" id="pay-back" type="button">Retour</button>

    <div class="due">
      <span class="due-label" id="due-label">À payer</span>
      <span class="due-amount" id="due-amount">0,00 €</span>
      <span class="due-note" id="due-note" hidden></span>
    </div>

    <!-- Cash : combien le client a donné -->
    <div class="cash-pad" id="cash-pad" hidden>
      <p class="pad-title">Le client donne</p>
      <div class="pad" id="pad"></div>
      <div class="change" id="change" hidden>
        <span class="change-label">À rendre</span>
        <span class="change-amount" id="change-amount">0,00 €</span>
      </div>
    </div>

    <!-- Bancontact : rien à saisir, on attend le terminal -->
    <div class="card-wait" id="card-wait" hidden>
      <p class="card-msg">Encodez le montant sur le terminal Bancontact</p>
    </div>

    <button class="confirm" id="confirm" type="button">Encaissé</button>
  </div>
</section>

<!-- Confirmation de fin de vente -->
<div class="done" id="done" hidden>
  <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
    <circle class="check-circle" cx="26" cy="26" r="24"/>
    <path class="check-mark" d="M14 27l8 8 16-17"/>
  </svg>
  <p class="done-text" id="done-text"></p>
</div>

<script src="/js/app.js"></script>
</body>
</html>
