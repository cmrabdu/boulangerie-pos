# Installation Debian non assistée pour la caisse.
#
# À utiliser avec l'image « netinst » de Debian 12 (bookworm) amd64.
# Au menu du démarrage, presser « e » puis ajouter à la ligne du noyau :
#
#     auto=true priority=critical preseed/file=/cdrom/preseed.cfg
#
# ou, si le fichier est servi par le réseau :
#
#     auto=true priority=critical url=http://…/preseed.cfg
#
# ────────────────────────────────────────────────────────────────────────────
#  AVERTISSEMENT — ce fichier EFFACE LE DISQUE.
#
#  Il partitionne automatiquement le premier disque trouvé. Avant de lancer
#  l'installation, DÉBRANCHER physiquement le disque d'origine de la caisse.
#  Un disque absent ne peut pas être effacé, et c'est la seule garantie qui ne
#  dépende d'aucun réglage.
# ────────────────────────────────────────────────────────────────────────────

### Langue et clavier
d-i debian-installer/locale string fr_BE.UTF-8
d-i keyboard-configuration/xkb-keymap select be

### Réseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string caisse
d-i netcfg/get_domain string local
d-i netcfg/hostname string caisse

### Miroir
d-i mirror/country string BE
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Horloge — les ventes sont horodatées, l'heure doit être juste
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Brussels
d-i clock-setup/ntp boolean true

### Comptes
# Pas de compte root actif : on administre par sudo depuis le compte « abdu ».
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Abdu
d-i passwd/username string abdu
# Mot de passe à changer au premier accès. L'accès réel se fera par clé SSH.
d-i passwd/user-password password caisse-a-changer
d-i passwd/user-password-again password caisse-a-changer
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitionnement
# Tout dans une seule partition : une caisse n'a pas de raison d'avoir un /home
# séparé, et un schéma simple est un schéma qu'on sait réparer.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Pas de fichier d'échange : 8 Go de mémoire pour un navigateur et un binaire
# de 10 Mo, l'échange ne servirait qu'à user le SSD.
d-i partman-basicfilesystems/no_swap boolean false

### Paquets — le strict minimum, le reste vient de l'installeur du projet
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popcon/participate boolean false

### Amorçage
d-i grub-installer/only_debian boolean true
# os-prober désactivé : GRUB ne doit ni explorer ni proposer un autre disque.
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Fin
d-i finish-install/reboot_in_progress note

# Après l'installation, il reste à copier le kit et à lancer :
#     sudo ./installer.sh
